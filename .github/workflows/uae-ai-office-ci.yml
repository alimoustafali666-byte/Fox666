name: uae-ai-office CI

on:
  pull_request:
    paths:
      - "uae-ai-office/**"
  push:
    branches: [main]
    paths:
      - "uae-ai-office/**"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uae-ai-office/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://uae_app:uae_app@localhost:5432/uae_ai_office
      TEST_DATABASE_URL: postgresql+psycopg://uae_app:uae_app@localhost:5432/uae_ai_office
      # CI-only throwaway value -- not a real secret, never used outside
      # this ephemeral test run.
      JWT_SECRET_KEY: ci-test-only-secret-value-not-used-anywhere-real
      # Tests run over plain http://testserver; the refresh cookie's
      # Secure flag would otherwise silently block it from ever being
      # sent, same as real browsers would over plain HTTP.
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Create app role and database
        # Non-superuser role, matching how the app connects in every other
        # environment -- RLS's FORCE clause is meaningless if tests run as
        # the table owner *and* that owner is a superuser (superusers
        # always bypass RLS). CREATEDB is only needed for the migration
        # test's scratch database.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE uae_app WITH LOGIN PASSWORD 'uae_app' CREATEDB"
          psql -h localhost -U postgres -c "CREATE DATABASE uae_ai_office OWNER uae_app"
      - run: ruff check app tests alembic
      - run: alembic upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uae-ai-office/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

