[project]
name = "uae-ai-office-backend"
version = "0.1.0"
description = "UAE AI Office backend (FastAPI, modular monolith)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "passlib[argon2]>=1.7",
    "boto3>=1.35",
    "python-multipart>=0.0.12",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pypdfium2>=4.30",
    "pytesseract>=0.3.13",
    "pgvector>=0.3",
    "httpx>=0.27",
    "anthropic>=1.0",
    "reportlab>=4.2",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "respx>=0.20",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008 (function call in argument default) is a false positive for
# FastAPI's Depends(...) pattern, which is specifically designed to be
# used as an argument default -- that's how FastAPI's dependency
# injection works, not a bug to fix.
ignore = ["B008"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

